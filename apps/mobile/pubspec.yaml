name: ludo_lovers
description: Ludo Lovers Android-first social Ludo game.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flame: ^1.18.0
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  audioplayers: ^6.0.0
  go_router: ^14.2.0
  flutter_riverpod: ^2.5.1
  supabase_flutter: ^2.6.0
  uuid: ^4.5.0
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/ludo_lovers_logo.jpg
    - assets/images/ludo_board_final.png
    - assets/images/ludo_board.jpg
    - assets/images/ludo_board_glass.png

# Generates Android mipmap launcher icons and the iOS AppIcon.appiconset.
# The supplied artwork is used as the foreground; the solid luxury-black
# adaptive background prevents launcher-mask cropping from exposing empty edges.
flutter_launcher_icons:
  android: launcher_icon
  ios: true
  image_path: assets/images/ludo_lovers_icon.png
  adaptive_icon_background: "#080808"
  adaptive_icon_foreground: assets/images/ludo_lovers_icon.png
  adaptive_icon_foreground_inset: 16
  min_sdk_android: 21
  remove_alpha_ios: true
