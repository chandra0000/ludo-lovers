name: Flutter checks

on:
  push:
    branches:
      - main
      - fix/gameplay-black-screen-root-cause
    paths:
      - "apps/mobile/**"
      - ".github/workflows/flutter-checks.yml"
  pull_request:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/flutter-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Analyze, test, and build Android arm64 debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Set up Python for deterministic artwork optimization
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate the phone-sized gameplay WebP
        run: |
          python -m pip install Pillow==11.3.0
          python tool/optimize_game_artwork.py

      - name: Clear Flutter build outputs
        run: flutter clean

      - name: Generate Android platform scaffold if needed
        run: |
          if [ ! -d android ] || [ ! -d ios ]; then
            flutter create --platforms=android,ios --org com.ludolovers --project-name ludo_lovers .
          fi
          rm -f test/widget_test.dart

      - name: Set Android launcher app name
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text(encoding="utf-8")
          updated, replacements = re.subn(
              r'android:label="[^"]*"',
              'android:label="Ludo lovers"',
              content,
              count=1,
          )
          if replacements != 1:
              raise SystemExit(
                  f"Expected one android:label in {manifest}, found {replacements}"
              )
          if 'android:label="Ludo lovers"' not in updated:
              raise SystemExit("Android launcher label was not updated")

          if "io.flutter.embedding.android.EnableImpeller" not in updated:
              impeller_metadata = '''    <meta-data
                  android:name="io.flutter.embedding.android.EnableImpeller"
                  android:value="false" />
              '''
              updated, application_tags = re.subn(
                  r"</application>",
                  impeller_metadata + "</application>",
                  updated,
                  count=1,
              )
              if application_tags != 1:
                  raise SystemExit(
                      f"Expected one </application> in {manifest}, found {application_tags}"
                  )

          manifest.write_text(updated, encoding="utf-8")
          print("Android launcher label set to: Ludo lovers")
          print("Android Impeller renderer disabled for device compatibility")

          wrapper = Path("android/gradle/wrapper/gradle-wrapper.properties")
          wrapper_content = wrapper.read_text(encoding="utf-8")
          wrapper_content, wrapper_urls = re.subn(
              r"^distributionUrl=.*?(gradle-[^/]+?)-(?:all|bin)\.zip$",
              r"distributionUrl=https\\://downloads.gradle-dn.com/distributions/\1-bin.zip",
              wrapper_content,
              count=1,
              flags=re.MULTILINE,
          )
          if wrapper_urls != 1:
              raise SystemExit(
                  f"Expected one Gradle distributionUrl in {wrapper}, found {wrapper_urls}"
              )
          wrapper.write_text(wrapper_content, encoding="utf-8")
          print("Gradle wrapper uses the official binary distribution host")
          PY

      - name: Format Dart sources
        run: dart format .

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate Android and iOS launcher icons
        run: dart run flutter_launcher_icons

      - name: Analyze Dart and Flutter code
        run: flutter analyze

      - name: Run automated tests
        run: flutter test

      - name: Build Android arm64 debug APK
        run: |
          flutter build apk --debug --target-platform android-arm64
          test -f build/app/outputs/flutter-apk/app-debug.apk
          mkdir -p build/device-test
          cp build/app/outputs/flutter-apk/app-debug.apk build/device-test/ludo-lovers-debug.apk

      - name: Report APK size
        run: ls -lh build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload Android debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ludo-lovers-debug-apk-arm64
          path: apps/mobile/build/device-test/ludo-lovers-debug.apk
          if-no-files-found: error
          retention-days: 7
