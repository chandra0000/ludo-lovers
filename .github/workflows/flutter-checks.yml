name: Flutter checks

on:
  push:
    branches:
      - main
    paths:
      - "apps/mobile/**"
      - ".github/workflows/flutter-checks.yml"
  pull_request:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/flutter-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Analyze, test, and build Android arm64 debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Set up Python for deterministic artwork optimization
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate the phone-sized gameplay WebP
        run: |
          python -m pip install Pillow==11.3.0
          python tool/optimize_game_artwork.py

      - name: Clear Flutter build outputs
        run: flutter clean

      - name: Generate Android platform scaffold if needed
        run: |
          if [ ! -d android ] || [ ! -d ios ]; then
            flutter create --platforms=android,ios --org com.ludolovers --project-name ludo_lovers .
          fi
          rm -f test/widget_test.dart

      - name: Set Android launcher app name
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text(encoding="utf-8")
          updated, replacements = re.subn(
              r'android:label="[^"]*"',
              'android:label="Ludo lovers"',
              content,
              count=1,
          )
          if replacements != 1:
              raise SystemExit(
                  f"Expected one android:label in {manifest}, found {replacements}"
              )
          manifest.write_text(updated, encoding="utf-8")
          if 'android:label="Ludo lovers"' not in updated:
              raise SystemExit("Android launcher label was not updated")
          print("Android launcher label set to: Ludo lovers")
          PY

      - name: Format Dart sources
        run: dart format .

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate Android and iOS launcher icons
        run: dart run flutter_launcher_icons

      - name: Analyze Dart and Flutter code
        run: flutter analyze

      - name: Run automated tests
        run: flutter test

      - name: Build Android arm64 debug APK
        run: flutter build apk --debug --target-platform android-arm64

      - name: Report APK size
        run: ls -lh build/app/outputs/flutter-apk/app-armeabi-v7a-debug.apk build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk 2>/dev/null || ls -lh build/app/outputs/flutter-apk/

      - name: Upload Android debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ludo-lovers-debug-apk-arm64
          path: apps/mobile/build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
          if-no-files-found: error
          retention-days: 7
