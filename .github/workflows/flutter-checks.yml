name: Flutter checks

on:
  push:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/flutter-checks.yml"
  pull_request:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/flutter-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Generate Android platform scaffold
        run: |
          flutter create --platforms=android --org com.ludolovers --project-name ludo_lovers .
          # Flutter create adds a template test for MyApp; this project uses LudoLoversApp.
          rm -f test/widget_test.dart

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze Dart and Flutter code
        run: flutter analyze

      - name: Run automated tests
        run: flutter test

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ludo-lovers-debug-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
